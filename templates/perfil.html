<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil — Helix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='logo.png')}}">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: #f5f0e8;
      color: #2c2520;
      font-family: 'Outfit', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    a { text-decoration: none; color: inherit; }
    :root {
      --bg: #f5f0e8;
      --bg-alt: #ede7d9;
      --bg-card: #ece5d5;
      --cream: #faf7f2;
      --border: rgba(160,140,110,0.22);
      --border-mid: rgba(160,140,110,0.4);
      --text: #2c2520;
      --muted: #8c7d6a;
      --faint: #b5a898;
      --sage: #8fa68a;
      --sage-dark: #7aab78;
      --sage-soft: rgba(143,166,138,0.15);
      --blush: #c4a99a;
      --blush-soft: rgba(196,169,154,0.18);
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(160,140,110,0.3); border-radius: 2px; }

    /* ── Navbar ── */
    .navbar {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 48px; height: 64px;
      background: rgba(245,240,232,0.9); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .navbar-logo {
      display: flex; align-items: center; gap: 10px;
      font-family: 'DM Serif Display', Georgia, serif;
      font-style: italic; font-size: 20px; letter-spacing: 0.1em; font-weight: 400;
    }
    .navbar-nav { display: flex; align-items: center; gap: 6px; }
    .nav-link {
      padding: 6px 16px; border-radius: 100px; font-size: 13px; color: var(--muted);
      transition: all 0.18s; white-space: nowrap;
    }
    .nav-link:hover { background: var(--bg-card); color: var(--text); }
    .nav-link.active { background: var(--sage-soft); color: var(--text); font-weight: 500; }
    .navbar-user { display: flex; align-items: center; gap: 10px; }
    .user-name { font-size: 13px; color: var(--muted); }
    .user-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--sage-soft); border: 1.5px solid var(--border-mid);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 500; color: var(--sage-dark);
    }
    .btn-logout {
      padding: 6px 14px; border-radius: 100px; font-size: 12px;
      color: var(--faint); border: 1px solid var(--border);
      background: transparent; cursor: pointer; font-family: 'Outfit', sans-serif;
      transition: all 0.18s;
    }
    .btn-logout:hover { color: var(--muted); border-color: var(--border-mid); }

    /* ── Page Wrapper ── */
    .page { max-width: 1140px; margin: 0 auto; padding: 56px 48px 100px; }
    
    .page-header {
      margin-bottom: 48px;
    }
    .page-eyebrow {
      font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--faint); margin-bottom: 10px;
    }
    .page-title {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: clamp(28px, 4vw, 48px); font-weight: 400; color: var(--text);
      line-height: 1.05; margin-bottom: 12px;
    }
    .page-sub {
      font-size: 15px; color: var(--muted); line-height: 1.7;
      max-width: 540px; font-weight: 300;
    }

    /* ── Filter / Navigation Controls ── */
    .inventory-nav {
      display: flex; gap: 10px; margin-bottom: 32px; border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .inv-tab {
      background: none; border: none; font-family: 'Outfit', sans-serif; font-size: 14px;
      color: var(--muted); cursor: pointer; padding: 8px 16px; border-radius: 100px;
      transition: all 0.2s;
    }
    .inv-tab:hover { color: var(--text); background: var(--bg-card); }
    .inv-tab.active { background: var(--sage-soft); color: var(--text); font-weight: 500; }

    /* ── Trait Cards Grid ── */
    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    /* ── Trait Card ── */
    .trait-card {
      background: var(--cream); border-radius: 18px;
      border: 1px solid var(--border); padding: 22px;
      cursor: pointer; transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      display: flex; flex-direction: column; justify-content: space-between;
      min-height: 160px;
    }
    .trait-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(44,37,32,0.08);
      border-color: var(--border-mid);
    }
    .trait-card:active { transform: translateY(-1px); }

    .trait-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 12px;
    }
    .trait-category {
      font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--faint);
    }
    .rarity-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 500; color: var(--muted);
    }
    .rarity-pip {
      width: 7px; height: 7px; border-radius: 50%;
    }
    .rarity-comum    { background: var(--faint); }
    .rarity-incomum  { background: var(--sage); }
    .rarity-raro     { background: var(--blush); }
    .rarity-epico    { background: #a98bd4; }
    .rarity-lendario { background: #c4a55a; }

    .trait-title {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 18px; font-weight: 400; color: var(--text); line-height: 1.2;
      margin-bottom: 14px;
    }

    .trait-action-text {
      font-size: 11px; font-weight: 500; color: var(--sage-dark);
      letter-spacing: 0.04em; margin-top: auto; display: flex; align-items: center; gap: 4px;
    }

    /* ── Modals / Overlays ── */
    .overlay {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: rgba(245,240,232,0.72); backdrop-filter: blur(14px);
      align-items: center; justify-content: center; padding: 24px;
    }
    .overlay.open { display: flex; }

    .modal {
      background: var(--cream); border-radius: 24px;
      border: 1px solid var(--border-mid);
      box-shadow: 0 32px 80px rgba(44,37,32,0.14), 0 4px 20px rgba(44,37,32,0.06);
      width: 100%; max-width: 440px; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .modal-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 28px 28px 16px; border-bottom: 1px solid var(--border);
    }
    .modal-eyebrow {
      font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint);
      margin-bottom: 4px;
    }
    .modal-title { font-family: 'DM Serif Display', Georgia, serif; font-size: 24px; font-weight: 400; color: var(--text); }
    .modal-close {
      width: 32px; height: 32px; border-radius: 50%;
      border: 1px solid var(--border); background: transparent;
      color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-close:hover { background: var(--bg-card); color: var(--text); }

    .modal-body { padding: 28px; }

    .form-group {
      display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px;
    }
    .form-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .form-input {
      width: 100%; background: var(--cream); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 16px; font-size: 14px; color: var(--text);
      outline: none; font-family: 'Outfit', sans-serif; transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--sage); }
    .form-input::placeholder { color: var(--faint); }

    .fee-disclaimer {
      font-size: 11px; color: var(--faint); line-height: 1.5; margin-bottom: 24px;
    }
    .fee-disclaimer strong { color: var(--muted); }

    .btn-submit {
      width: 100%; padding: 13px; border-radius: 12px; border: none;
      cursor: pointer; background: var(--sage); color: var(--cream);
      font-size: 14px; font-family: 'Outfit', sans-serif; font-weight: 500;
      box-shadow: 0 4px 16px rgba(143,166,138,0.3); transition: all 0.2s;
    }
    .btn-submit:hover { background: var(--sage-dark); transform: translateY(-1px); }

    @media (max-width: 900px) {
      .navbar { padding: 0 24px; }
      .navbar-nav { display: none; }
      .page { padding: 36px 20px 80px; }
    }
  </style>
</head>
<body>

  <!-- ── Navbar ── -->
  <header class="navbar">
    <a href="/user/{{ word }}" class="navbar-logo">
      <svg width="24" height="24" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <circle cx="13" cy="13" r="12" stroke="#8fa68a" stroke-width="1.2" opacity="0.6"/>
        <circle cx="13" cy="13" r="4.5" fill="#8fa68a" opacity="0.55"/>
        <circle cx="13" cy="13" r="8" stroke="#8fa68a" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.4"/>
        <circle cx="7" cy="7.5" r="1.8" fill="#c4a99a" opacity="0.7"/>
        <circle cx="19" cy="18.5" r="1.8" fill="#8fa68a" opacity="0.7"/>
      </svg>
      Helix
    </a>

    <nav class="navbar-nav" aria-label="Navegação principal">
      <a href="/user/{{ word }}" class="nav-link">Início</a>
      <a href="/user/{{ word }}/marketplace" class="nav-link">Marketplace</a>
      <a href="/user/{{ word }}/editor" class="nav-link">Editor de Filho</a>
      <a href="/user/{{ word }}/lootbox" class="nav-link">Cápsulas</a>
    </nav>

    <div class="navbar-user">
      <span class="user-name">{{ word }} (${{ creditos }} CR)</span>
      <a href="/user/{{ word }}/perfil">
        <div class="user-avatar" title="Perfil" style="border-color: var(--sage);">U</div>
      </a>
      <a href="/logout">
        <button class="btn-logout">Sair</button>
      </a>
    </div>
  </header>

  <!-- ── Main content ── -->
  <main class="page">
    <div class="page-header">
      <p class="page-eyebrow">Página Pessoal</p>
      <h1 class="page-title">Seu Perfil</h1>
      <p class="page-sub">Visualize seus genes no inventário e anuncie-os diretamente no marketplace.</p>
    </div>

    <!-- Tab filter controls -->
    <div class="inventory-nav">
      <button class="inv-tab active" data-filter="all">Todos os Itens</button>
      <button class="inv-tab" data-filter="cosmeticos">Cosméticos</button>
      <button class="inv-tab" data-filter="atributos">Atributos</button>
    </div>

    <!-- Inventory list -->
    <div class="inventory-grid" id="inventory-grid">
      <!-- Grid items injected by JS -->
    </div>
  </main>

  <!-- ── Sell Trait Modal ── -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <p class="modal-eyebrow" id="modal-eyebrow"></p>
          <h2 class="modal-title" id="modal-title">Anunciar Trait</h2>
        </div>
        <button class="modal-close" id="modal-close">×</button>
      </div>
      <div class="modal-body">
        <form id="sell-form" method="POST" action="/user/{{ word }}/perfil">
          <input type="hidden" name="nome" id="form-nome" />
          <input type="hidden" name="categoria" id="form-categoria" />
          <input type="hidden" name="raridade" id="form-raridade" />
          
          <div class="form-group">
            <label class="form-label" for="price-buyer">Valor Pago pelo Comprador (CR)</label>
            <input class="form-input" type="number" name="preco" id="price-buyer" min="10" placeholder="Ex: 500" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="price-seller">Valor que você irá receber (CR)</label>
            <input class="form-input" type="number" id="price-seller" min="9" placeholder="Ex: 475" required />
          </div>

          <p class="fee-disclaimer">
            * A Helix retém uma taxa administrativa de <strong>5%</strong> por transação.
          </p>

          <button type="submit" class="btn-submit">Anunciar no Marketplace</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const INVENTORY = {{ inventory | tojson | safe }};

    const rarityLabels = {
      comum: 'Comum',
      incomum: 'Incomum',
      raro: 'Raro',
      epico: 'Épico',
      lendario: 'Lendário'
    };

    const grid = document.getElementById('inventory-grid');
    const tabs = document.querySelectorAll('.inv-tab');
    let activeFilter = 'all';

    // Render items
    function renderInventory() {
      grid.innerHTML = '';
      const filtered = INVENTORY.filter(item => {
        if (activeFilter === 'all') return true;
        if (activeFilter === 'cosmeticos') return item.type === 'cosmetico';
        if (activeFilter === 'atributos') return item.type === 'atributo';
        return false;
      });

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'trait-card';
        card.innerHTML = `
          <div>
            <div class="trait-header">
              <span class="trait-category">${item.category}</span>
              <span class="rarity-badge">
                <span class="rarity-pip rarity-${item.rarity}"></span>
                ${rarityLabels[item.rarity]}
              </span>
            </div>
            <h3 class="trait-title">${item.name}</h3>
          </div>
          <span class="trait-action-text">
            Anunciar trait +
          </span>
        `;
        card.addEventListener('click', () => openSellModal(item));
        grid.appendChild(card);
      });
    }

    // Modal control
    const overlay = document.getElementById('overlay');
    const btnClose = document.getElementById('modal-close');
    const modalEyebrow = document.getElementById('modal-eyebrow');
    const modalTitle = document.getElementById('modal-title');
    
    // Form fields
    const formNome = document.getElementById('form-nome');
    const formCategoria = document.getElementById('form-categoria');
    const formRaridade = document.getElementById('form-raridade');
    const priceBuyer = document.getElementById('price-buyer');
    const priceSeller = document.getElementById('price-seller');
    const feeRate = 0.05;

    function openSellModal(item) {
      modalEyebrow.textContent = `${item.category} — ${rarityLabels[item.rarity]}`;
      modalTitle.textContent = item.name;
      
      formNome.value = item.name;
      formCategoria.value = item.category;
      formRaridade.value = item.rarity;
      
      priceBuyer.value = '';
      priceSeller.value = '';
      
      overlay.classList.add('open');
    }

    btnClose.addEventListener('click', () => overlay.classList.remove('open'));
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.remove('open');
    });

    // Dynamic fee calculation
    priceBuyer.addEventListener('input', () => {
      const val = parseFloat(priceBuyer.value);
      if (!isNaN(val)) {
        priceSeller.value = Math.floor(val * (1 - feeRate));
      } else {
        priceSeller.value = '';
      }
    });

    priceSeller.addEventListener('input', () => {
      const val = parseFloat(priceSeller.value);
      if (!isNaN(val)) {
        priceBuyer.value = Math.ceil(val / (1 - feeRate));
      } else {
        priceBuyer.value = '';
      }
    });

    // Filter switching
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeFilter = tab.getAttribute('data-filter');
        renderInventory();
      });
    });

    // Initial render
    renderInventory();
  </script>
</body>
</html>
