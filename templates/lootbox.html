<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lootboxes — Helix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: #f5f0e8;
      color: #2c2520;
      font-family: 'Outfit', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    a { text-decoration: none; color: inherit; }
    :root {
      --bg: #f5f0e8;
      --bg-alt: #ede7d9;
      --bg-card: #ece5d5;
      --cream: #faf7f2;
      --border: rgba(160,140,110,0.22);
      --border-mid: rgba(160,140,110,0.4);
      --text: #2c2520;
      --muted: #8c7d6a;
      --faint: #b5a898;
      --sage: #8fa68a;
      --sage-dark: #7aab78;
      --sage-soft: rgba(143,166,138,0.15);
      --blush: #c4a99a;
      --blush-soft: rgba(196,169,154,0.18);
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(160,140,110,0.3); border-radius: 2px; }

    /* ── Navbar ── */
    .navbar {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 48px; height: 64px;
      background: rgba(245,240,232,0.9); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .navbar-logo {
      display: flex; align-items: center; gap: 10px;
      font-family: 'DM Serif Display', Georgia, serif;
      font-style: italic; font-size: 20px; letter-spacing: 0.1em; font-weight: 400;
    }
    .navbar-nav { display: flex; align-items: center; gap: 6px; }
    .nav-link {
      padding: 6px 16px; border-radius: 100px; font-size: 13px; color: var(--muted);
      transition: all 0.18s; white-space: nowrap;
    }
    .nav-link:hover { background: var(--bg-card); color: var(--text); }
    .nav-link.active { background: var(--sage-soft); color: var(--text); font-weight: 500; }
    .navbar-user { display: flex; align-items: center; gap: 10px; }
    .user-name { font-size: 13px; color: var(--muted); }
    .user-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--sage-soft); border: 1.5px solid var(--border-mid);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 500; color: var(--sage-dark);
    }
    .btn-logout {
      padding: 6px 14px; border-radius: 100px; font-size: 12px;
      color: var(--faint); border: 1px solid var(--border);
      background: transparent; cursor: pointer; font-family: 'Outfit', sans-serif;
      transition: all 0.18s;
    }
    .btn-logout:hover { color: var(--muted); border-color: var(--border-mid); }

    /* ── Page ── */
    .page { max-width: 1140px; margin: 0 auto; padding: 56px 48px 100px; }
    .page-eyebrow {
      font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--faint); margin-bottom: 10px;
    }
    .page-title {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: clamp(28px, 4vw, 48px); font-weight: 400; color: var(--text);
      line-height: 1.05; margin-bottom: 12px;
    }
    .page-sub {
      font-size: 15px; color: var(--muted); line-height: 1.7;
      max-width: 520px; font-weight: 300; margin-bottom: 56px;
    }

    /* ── Category block ── */
    .category { margin-bottom: 56px; }
    .category-header {
      display: flex; align-items: center; gap: 16px; margin-bottom: 24px;
    }
    .category-label {
      font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--faint);
    }
    .category-line { flex: 1; height: 1px; background: var(--border); }

    /* ── Lootbox grid ── */
    .lootbox-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }

    /* ── Lootbox card ── */
    .lootbox-card {
      background: var(--cream); border-radius: 18px;
      border: 1px solid var(--border);
      cursor: pointer; user-select: none;
      transition: transform 0.22s, box-shadow 0.22s, border-color 0.22s;
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .lootbox-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 36px rgba(44,37,32,0.1);
      border-color: var(--border-mid);
    }
    .lootbox-card:active { transform: translateY(-1px); }

    .card-visual {
      height: 130px;
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    /* Per-category tints */
    .card-visual.cosmetico {
      background: linear-gradient(145deg, #f0ebe0, #e8e0d0);
    }
    .card-visual.atributo {
      background: linear-gradient(145deg, #e8ede6, #dde5da);
    }
    .card-icon {
      font-size: 36px; line-height: 1;
      filter: saturate(0.7);
    }
    .card-helix-deco {
      position: absolute; right: -6px; bottom: -8px;
      opacity: 0.12; pointer-events: none;
    }

    .card-body { padding: 16px 18px 18px; flex: 1; display: flex; flex-direction: column; }
    .card-name {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 17px; font-weight: 400; color: var(--text); margin-bottom: 4px;
    }
    .card-sub { font-size: 11px; color: var(--faint); line-height: 1.5; }
    .card-count {
      margin-top: 12px; font-size: 11px; color: var(--sage-dark);
      letter-spacing: 0.04em;
    }

    /* ── Popup overlay ── */
    .overlay {
      display: none;
      position: fixed; inset: 0; z-index: 100;
      background: rgba(245,240,232,0.72);
      backdrop-filter: blur(14px);
      align-items: center; justify-content: center;
      padding: 24px;
    }
    .overlay.open { display: flex; }

    /* ── Popup modal ── */
    .modal {
      background: var(--cream);
      border-radius: 24px;
      border: 1px solid var(--border-mid);
      box-shadow: 0 32px 80px rgba(44,37,32,0.14), 0 4px 20px rgba(44,37,32,0.06);
      width: 100%; max-width: 480px;
      max-height: 88vh;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 28px 28px 0;
      flex-shrink: 0;
    }
    .modal-eyebrow {
      font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--faint); margin-bottom: 4px;
    }
    .modal-title {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 26px; font-weight: 400; color: var(--text);
    }
    .modal-close {
      width: 32px; height: 32px; border-radius: 50%;
      border: 1px solid var(--border); background: transparent;
      color: var(--muted); font-size: 20px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 2px; transition: all 0.18s;
      font-family: sans-serif;
    }
    .modal-close:hover { background: var(--bg-card); color: var(--text); }

    .modal-desc {
      padding: 8px 28px 16px;
      font-size: 13px; color: var(--muted); line-height: 1.6;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }

    .modal-body {
      overflow-y: auto; padding: 20px 28px;
      flex: 1;
    }
    .modal-body::-webkit-scrollbar { width: 3px; }
    .modal-body::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 2px; }

    .items-list { display: flex; flex-direction: column; gap: 10px; }

    .item-row {
      display: flex; flex-direction: column; gap: 5px;
    }
    .item-row-top {
      display: flex; align-items: center; justify-content: space-between;
    }
    .item-row-name {
      font-size: 13px; color: var(--text); font-weight: 400;
    }
    .item-row-right {
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .item-chance {
      font-size: 12px; font-weight: 500; color: var(--muted);
      min-width: 36px; text-align: right;
    }
    .rarity-pip {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }
    .rarity-comum    { background: var(--faint); }
    .rarity-incomum  { background: var(--sage); }
    .rarity-raro     { background: var(--blush); }
    .rarity-epico    { background: #a98bd4; }
    .rarity-lendario { background: #c4a55a; }

    .chance-bar-bg {
      height: 3px; background: var(--border); border-radius: 2px; overflow: hidden;
    }
    .chance-bar-fill {
      height: 100%; border-radius: 2px;
      transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    }
    .fill-comum    { background: var(--faint); }
    .fill-incomum  { background: var(--sage); }
    .fill-raro     { background: var(--blush); }
    .fill-epico    { background: #a98bd4; }
    .fill-lendario { background: #c4a55a; }

    .modal-footer {
      padding: 16px 28px 24px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .rarity-legend {
      display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
    }
    .legend-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 10px; color: var(--faint); letter-spacing: 0.04em;
    }
    .btn-open-box {
      width: 100%; padding: 13px; border-radius: 12px; border: none;
      background: var(--sage); color: var(--cream);
      font-size: 14px; font-family: 'Outfit', sans-serif; font-weight: 500;
      cursor: pointer; letter-spacing: 0.02em;
      box-shadow: 0 4px 16px rgba(143,166,138,0.28);
      transition: all 0.2s;
    }
    .btn-open-box:hover {
      background: var(--sage-dark);
      box-shadow: 0 6px 24px rgba(122,171,120,0.38);
      transform: translateY(-1px);
    }

    @media (max-width: 900px) {
      .navbar { padding: 0 20px; }
      .navbar-nav { display: none; }
      .page { padding: 40px 20px 80px; }
      .lootbox-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    }
  </style>
</head>
<body>

  <!-- ── Navbar ── -->

      <div class="lootbox-grid" id="grid-atributos"></div>

  </main>

  <!-- ── Popup overlay ── -->

      <p class="modal-desc" id="modal-desc"></p>

    // ── Helix SVG builder ────────────────────────────────────────
    function makeHelixSVG(w, h) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
      svg.setAttribute('width', w); svg.setAttribute('height', h)
      svg.setAttribute('viewBox', `0 0 ${w} ${h}`)
      svg.setAttribute('aria-hidden', 'true')
      svg.style.overflow = 'visible'
      const steps = 16, cx = w / 2, amp = w * 0.38
      const p1 = [], p2 = []
      for (let i = 0; i <= steps; i++) {
        const t = i / steps, y = t * h, angle = t * Math.PI * 5
        const x1 = cx + Math.sin(angle) * amp, x2 = cx - Math.sin(angle) * amp
        p1.push(`${x1},${y}`); p2.push(`${x2},${y}`)
        if (i % 3 === 0) {
          const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line')
          ln.setAttribute('x1', x1); ln.setAttribute('y1', y)
          ln.setAttribute('x2', x2); ln.setAttribute('y2', y)
          ln.setAttribute('stroke', '#8fa68a')
          ln.setAttribute('stroke-width', '1')
          ln.setAttribute('opacity', (0.4 + 0.6 * Math.abs(Math.sin(angle))) * 0.5)
          svg.appendChild(ln)
        }
      }
      ;[[p1, '#8fa68a'], [p2, '#c4a99a']].forEach(([pts, color]) => {
        const pl = document.createElementNS('http://www.w3.org/2000/svg', 'polyline')
        pl.setAttribute('points', pts.join(' '))
        pl.setAttribute('fill', 'none'); pl.setAttribute('stroke', color)
        pl.setAttribute('stroke-width', '1.6'); pl.setAttribute('stroke-linecap', 'round')
        svg.appendChild(pl)
      })
      return svg
    }

    // ── Build grid ───────────────────────────────────────────────
    function buildGrid(boxes, gridId, type) {
      const grid = document.getElementById(gridId)
      boxes.forEach(box => {
        const card = document.createElement('div')
        card.className = 'lootbox-card'
        card.setAttribute('role', 'button')
        card.setAttribute('tabindex', '0')
        card.setAttribute('aria-label', `Abrir lootbox ${box.name}`)

        const visual = document.createElement('div')
        visual.className = `card-visual ${type}`
        const icon = document.createElement('span')
        icon.className = 'card-icon'
        icon.textContent = box.icon
        visual.appendChild(icon)

        const deco = document.createElement('div')
        deco.className = 'card-helix-deco'
        deco.appendChild(makeHelixSVG(36, 80))
        visual.appendChild(deco)

        const body = document.createElement('div')
        body.className = 'card-body'
        body.innerHTML = `
          <p class="card-name">${box.name}</p>
          <p class="card-sub">${box.sub}</p>
          <p class="card-count">${box.items.length} resultados possíveis</p>
        `
        card.appendChild(visual)
        card.appendChild(body)
        card.addEventListener('click', () => openModal(box))
        card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openModal(box) })
        grid.appendChild(card)
      })
    }

    buildGrid(BOXES.cosmeticos, 'grid-cosmeticos', 'cosmetico')
    buildGrid(BOXES.atributos,  'grid-atributos',  'atributo')

    // ── Modal logic ──────────────────────────────────────────────
    const overlay  = document.getElementById('overlay')
    const modalEl  = document.getElementById('modal')
    const closeBtn = document.getElementById('modal-close')

    function openModal(box) {
      document.getElementById('modal-eyebrow').textContent = box.sub
      document.getElementById('modal-title').textContent   = box.name
      document.getElementById('modal-desc').textContent    = box.desc

      const list = document.getElementById('modal-items')
      list.innerHTML = ''

      box.items.forEach(item => {
        const li = document.createElement('li')
        li.className = 'item-row'
        li.innerHTML = `
          <div class="item-row-top">
            <span class="item-row-name">${item.name}</span>
            <div class="item-row-right">
              <span class="item-chance">${item.chance}%</span>
              <span class="rarity-pip rarity-${item.rarity}"></span>
            </div>
          </div>
          <div class="chance-bar-bg">
            <div class="chance-bar-fill fill-${item.rarity}" style="width:0%"
                 data-target="${item.chance}"></div>
          </div>
        `
        list.appendChild(li)
      })

      overlay.classList.add('open')
      document.body.style.overflow = 'hidden'

      // Animate bars after render
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          list.querySelectorAll('.chance-bar-fill').forEach(bar => {
            bar.style.width = bar.dataset.target + '%'
          })
        })
      })
    }

    function closeModal() {
      overlay.classList.remove('open')
      document.body.style.overflow = ''
    }

    closeBtn.addEventListener('click', closeModal)
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal() })
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal() })

    document.getElementById('btn-open-box').addEventListener('click', () => {
      // Placeholder — wire to real open logic
      closeModal()
    })
  </script>
