<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta — Helix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f5f0e8;
      color: #2c2520;
      font-family: 'Outfit', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    :root {
      --bg: #f5f0e8;
      --bg-alt: #ede7d9;
      --bg-card: #ece5d5;
      --cream: #faf7f2;
      --border: rgba(160,140,110,0.22);
      --border-mid: rgba(160,140,110,0.4);
      --text: #2c2520;
      --muted: #8c7d6a;
      --faint: #b5a898;
      --sage: #8fa68a;
      --sage-dark: #7aab78;
      --blush: #c4a99a;
    }

    /* ── Navbar ── */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px; height: 64px;
      background: rgba(245,240,232,0.82);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .navbar-logo {
      display: flex; align-items: center; gap: 10px;
      color: var(--text); font-size: 20px; text-decoration: none;
      font-family: 'DM Serif Display', Georgia, serif;
      font-style: italic; letter-spacing: 0.1em; font-weight: 400;
    }
    .navbar-actions { display: flex; align-items: center; gap: 10px; }
    .btn-ghost {
      padding: 8px 20px; border-radius: 100px;
      border: 1px solid var(--border-mid); background: transparent;
      color: var(--text); font-size: 13px; font-family: 'Outfit', sans-serif;
      font-weight: 500; cursor: pointer; transition: all 0.2s;
      text-decoration: none; display: inline-block;
    }
    .btn-ghost:hover { background: rgba(143,166,138,0.18); border-color: var(--sage); }
    .btn-solid {
      padding: 8px 20px; border-radius: 100px;
      border: none; background: var(--sage);
      color: var(--cream); font-size: 13px; font-family: 'Outfit', sans-serif;
      font-weight: 500; cursor: pointer; transition: all 0.2s;
      box-shadow: 0 2px 12px rgba(143,166,138,0.28);
      text-decoration: none; display: inline-block;
    }
    .btn-solid:hover { background: var(--sage-dark); transform: translateY(-1px); box-shadow: 0 4px 18px rgba(122,171,120,0.35); }

    /* ── Auth page layout ── */
    .auth-page {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 80px 24px;
      position: relative; overflow: hidden;
    }
    .auth-helix {
      position: absolute; top: 50%; pointer-events: none;
    }
    .auth-helix.left  { left: 48px;  transform: translateY(-50%); }
    .auth-helix.right { right: 48px; transform: translateY(-50%) scaleX(-1); }

    /* ── Auth card ── */
    .auth-card {
      width: 100%; max-width: 420px;
      background: var(--cream);
      border-radius: 24px;
      border: 1px solid var(--border-mid);
      box-shadow: 0 24px 64px rgba(44,37,32,0.1), 0 4px 16px rgba(44,37,32,0.05);
      padding: 48px 40px;
      position: relative; z-index: 1;
    }
    .auth-back {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--faint); text-decoration: none;
      margin-bottom: 32px; transition: color 0.2s;
      font-family: 'Outfit', sans-serif;
    }
    .auth-back:hover { color: var(--muted); }
    .auth-eyebrow {
      font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--faint); margin-bottom: 8px;
    }
    .auth-title {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 32px; color: var(--text); margin-bottom: 32px; font-weight: 400;
    }

    /* ── Form ── */
    .auth-form { display: flex; flex-direction: column; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: 11px; letter-spacing: 0.08em; color: var(--muted); }
    .field-input {
      width: 100%; background: var(--cream);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 16px; font-size: 14px; color: var(--text);
      outline: none; transition: border-color 0.2s;
      font-family: 'Outfit', sans-serif;
    }
    .field-input:focus { border-color: var(--sage); }
    .field-input::placeholder { color: var(--faint); }
    .btn-submit {
      width: 100%; padding: 13px; border-radius: 12px; border: none;
      cursor: pointer; background: var(--sage); color: var(--cream);
      font-size: 14px; font-family: 'Outfit', sans-serif; font-weight: 500;
      letter-spacing: 0.03em; margin-top: 4px;
      box-shadow: 0 4px 16px rgba(143,166,138,0.3); transition: all 0.2s;
    }
    .btn-submit:hover { background: var(--sage-dark); box-shadow: 0 6px 24px rgba(122,171,120,0.38); transform: translateY(-1px); }
    .auth-terms {
      text-align: center; font-size: 11px; color: var(--faint); margin-top: 16px; line-height: 1.6;
    }
    .auth-terms a { color: var(--sage); text-decoration: none; transition: color 0.2s; }
    .auth-terms a:hover { color: var(--sage-dark); }
    .auth-switch {
      text-align: center; font-size: 12px; color: var(--faint); margin-top: 20px;
    }
    .auth-switch a {
      color: var(--sage); font-weight: 500; text-decoration: none; transition: color 0.2s;
    }
    .auth-switch a:hover { color: var(--sage-dark); }

    @media (max-width: 700px) {
      .navbar { padding: 0 20px; }
      .auth-helix { display: none; }
      .auth-card { padding: 36px 24px; }
    }
  </style>
</head>
<body>

  <!-- ── Navbar ── -->
  <header class="navbar">
    <a href="/" class="navbar-logo">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <circle cx="13" cy="13" r="12" stroke="#8fa68a" stroke-width="1.2" opacity="0.6"/>
        <circle cx="13" cy="13" r="4.5" fill="#8fa68a" opacity="0.55"/>
        <circle cx="13" cy="13" r="8" stroke="#8fa68a" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.4"/>
        <circle cx="7" cy="7.5" r="1.8" fill="#c4a99a" opacity="0.7"/>
        <circle cx="19" cy="18.5" r="1.8" fill="#8fa68a" opacity="0.7"/>
      </svg>
      Helix
    </a>
    <div class="navbar-actions">
      <a href="login" class="btn-ghost">Entrar</a>
      <a href="signin" class="btn-solid" aria-current="page">Criar conta</a>
    </div>
  </header>

  <!-- ── Auth page ── -->
  <main class="auth-page">

    <!-- DNA esquerda -->
    <div class="auth-helix left">
      <svg width="60" height="400" viewBox="0 0 60 400" aria-hidden="true" style="opacity:0.18;overflow:visible;">
        <g id="helix-left"></g>
      </svg>
    </div>
    <!-- DNA direita -->
    <div class="auth-helix right">
      <svg width="60" height="400" viewBox="0 0 60 400" aria-hidden="true" style="opacity:0.18;overflow:visible;">
        <g id="helix-right"></g>
      </svg>
    </div>

    <div class="auth-card">
      <a href="index" class="auth-back">← Voltar</a>

      <p class="auth-eyebrow">Novo acesso</p>
      <h1 class="auth-title">Criar conta</h1>

      <form class="auth-form" method="POST">
        <div class="field">
          <label class="field-label" for="name">Usuario</label>
          <input class="field-input" type="text" id="usuario" name="usuario" placeholder="Seu usuario:" autocomplete="name" />
        </div>
        <div class="field">
          <label class="field-label" for="password">Senha</label>
          <input class="field-input" type="password" id="senha" name="senha" placeholder="••••••••" autocomplete="new-password" />
        </div>
        <div class="field">
          <label class="field-label" for="confirmacao">Confirme sua senha</label>
          <input class="field-input" type="password" id="confirmacao" name="confirmacao" placeholder="••••••••" autocomplete="confirmacao" />
        </div>
        <button type="submit" class="btn-submit">Criar conta</button>
      </form>

      <p class="auth-terms">
        Ao continuar, você concorda com os
        <a href="#">Termos de Uso</a> e a
        <a href="#">Política de Privacidade</a>.
      </p>

      <p class="auth-switch">
        Já possui conta? <a href="/login">Entre</a>
      </p>
    </div>
  </main>

  <script>
    function drawHelix(id, w, h) {
      const g = document.getElementById(id)
      if (!g) return
      const steps = 28, cx = w / 2, amp = w * 0.38
      const p1 = [], p2 = []
      for (let i = 0; i <= steps; i++) {
        const t = i / steps, y = t * h
        const angle = t * Math.PI * 5
        const x1 = cx + Math.sin(angle) * amp
        const x2 = cx - Math.sin(angle) * amp
        p1.push(`${x1},${y}`)
        p2.push(`${x2},${y}`)
        if (i % 3 === 0) {
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line')
          const op = (0.5 + 0.5 * Math.abs(Math.sin(angle))) * 0.6
          line.setAttribute('x1', x1); line.setAttribute('y1', y)
          line.setAttribute('x2', x2); line.setAttribute('y2', y)
          line.setAttribute('stroke', '#8fa68a')
          line.setAttribute('stroke-width', '0.8')
          line.setAttribute('opacity', op)
          g.appendChild(line)
        }
      }
      const make = (pts, color) => {
        const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polyline')
        poly.setAttribute('points', pts.join(' '))
        poly.setAttribute('fill', 'none')
        poly.setAttribute('stroke', color)
        poly.setAttribute('stroke-width', '1.4')
        poly.setAttribute('stroke-linecap', 'round')
        g.appendChild(poly)
      }
      make(p1, '#8fa68a')
      make(p2, '#c4a99a')
    }
    drawHelix('helix-left',  60, 400)
    drawHelix('helix-right', 60, 400)
  </script>
</body>
</html>
